[package]
name = "bissue"
version = "0.1.0"
edition = "2024"
description = "beautiful-issues let you debug and report problems with ease. \nProject repo: https://github.com/solas-org/beautiful-issues ⭐"
homepage = "https://github.com/solas-org/beautiful-issues"
repository = "https://github.com/solas-org/beautiful-issues"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
url = "2.5.8"
toml = "1.1.5"
chrono = "0.4.45"
serde_json = "1.0.151"
derive_more = { version = "2.1.1", features = ["display"] }
owo-colors = "4.4.0"
dunce = "1.0.5"
anyhow = "1.0"
reqwest = { version = "0.13.5", features = ["json"] }
walkdir = "2.5.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
ratatui = "0.30.2"
toml-comment = "0.3.0"
tar = "0.4.46"
zstd = "0.14.0"
version-compare = "0.2.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
